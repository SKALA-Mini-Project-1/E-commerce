services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: "rootpass"
    ports:
      - "13306:3306"
    volumes:
      - msa_mariadb_data:/var/lib/mysql
      - ./infra/databases/mariadb/local-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - msa-network

  user-service:
    build:
      context: ./services/user-service
    image: local/user-service:compose
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_USERNAME: cloud
      MARIADB_PASSWORD: "Skala25a!23$$"
      USER_SERVICE_DB: user_service_db
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "18081:8080"
    networks:
      - msa-network

  product-service:
    build:
      context: ./services/product-service
    image: local/product-service:compose
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_USERNAME: cloud
      MARIADB_PASSWORD: "Skala25a!23$$"
      PRODUCT_SERVICE_DB: product_service_db
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "18082:8080"
    networks:
      - msa-network

  order-service:
    build:
      context: ./services/order-service
    image: local/order-service:compose
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_USERNAME: cloud
      MARIADB_PASSWORD: "Skala25a!23$$"
      ORDER_SERVICE_DB: order_service_db
      USER_SERVICE_BASE_URL: http://user-service:8080
      PRODUCT_SERVICE_BASE_URL: http://product-service:8080
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "18083:8080"
    networks:
      - msa-network

  payment-service:
    build:
      context: ./services/payment-service
    image: local/payment-service:compose
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_USERNAME: cloud
      MARIADB_PASSWORD: "Skala25a!23$$"
      PAYMENT_SERVICE_DB: payment_service_db
      ORDER_SERVICE_BASE_URL: http://order-service:8080
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "18084:8080"
    networks:
      - msa-network

volumes:
  msa_mariadb_data:

networks:
  msa-network:
