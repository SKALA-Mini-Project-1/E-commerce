apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-v1
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/version: v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/version: v1
    spec:
      priorityClassName: ecommerce-high-priority
      # initContainers:
      #   - name: wait-for-user-api
      #     image: curlimages/curl:8.10.1
      #     command:
      #       - sh
      #       - -c
      #       - until curl -fsS http://user-service:8080/actuator/health/readiness; do echo waiting for user-service; sleep 5; done
      containers:
        - name: frontend
          image: amdp-registry.skala-ai.com/skala26a-cloud/team4-frontend:2026.04.17-v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /frontend
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /frontend
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: frontend
                    app.kubernetes.io/version: v1
