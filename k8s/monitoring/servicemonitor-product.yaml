apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-service
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  namespaceSelector:
    matchNames:
      - ecommerce
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
