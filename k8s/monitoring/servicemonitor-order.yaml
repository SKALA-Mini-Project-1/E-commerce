apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-service
  namespace: ecommerce-lab
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  namespaceSelector:
    matchNames:
      - ecommerce-lab
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
