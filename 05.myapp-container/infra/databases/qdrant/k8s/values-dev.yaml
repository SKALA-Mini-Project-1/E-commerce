# values-efs-dev.yaml
# AWS EFS를 사용하는 Qdrant 개발 환경 설정

# Replica 수
replicaCount: 1

# Image 설정
image:
  repository: qdrant/qdrant
  tag: "v1.16.0"  # latest 대신 특정 버전 사용 (semver 호환)
  pullPolicy: Always

# Persistence 설정 (EFS 사용)
persistence:
  enabled: true
  storageClassName: "efs-sc-shared"  # storageClass 대신 storageClassName 사용
  accessModes:
    - ReadWriteMany  # EFS는 RWX 지원
  size: 50Gi
  annotations: {}

# Service 설정
service:
  type: ClusterIP  # Ingress 사용 시 ClusterIP로 설정
  port: 6333
  grpcPort: 6334

# LoadBalancer 설정 (Ingress 사용 시 불필요)
loadBalancer:
  enabled: false  # Ingress를 사용하므로 비활성화
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"

# API Key 설정 (Multi-tenancy 보안)
# 개발 환경에서는 직접 지정 가능 (운영환경에서는 Secret 사용 권장)
apiKey:
  # API Key 활성화 여부
  enabled: true
  # 직접 입력 방식 (개발용)
  value: 'Skala25a!23$'
  # Secret 사용 방식 (운영용 - enabled: true이고 existingSecret이 설정되면 value는 무시됨)
  existingSecret: ""  # 예: "qdrant-api-key"
  existingSecretKey: "api-key"  # Secret 내 키 이름

# Resources
resources:
  requests:
    memory: "500Mi"
    cpu: "500m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Qdrant 설정
config:
  cluster:
    enabled: false
  
  storage:
    # 성능 최적화
    performance:
      max_search_threads: 0  # 0 = CPU 코어 수만큼 자동 설정
    
    # Optimizer 설정
    optimizers:
      deleted_threshold: 0.2
      vacuum_min_vector_number: 1000
      default_segment_number: 0
      max_segment_size_kb: 200000
      indexing_threshold_kb: 20000
  
  # 로그 레벨
  log_level: "INFO"

# Security Context
securityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

# Node Affinity (선택사항)
nodeSelector: {}

# Tolerations
tolerations: []

# Pod Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - qdrant
        topologyKey: kubernetes.io/hostname

# Monitoring (Prometheus)
metrics:
  enabled: false
  serviceMonitor:
    enabled: false

# Ingress 설정
ingress:
  enabled: false