# values-efs-prod.yaml
# AWS EFS를 사용하는 Qdrant 운영 환경 설정

# Replica 수 (고가용성)
replicaCount: 3

# Image 설정
image:
  repository: qdrant/qdrant
  tag: "v1.16.0"  # 운영에서는 특정 버전 지정 권장
  pullPolicy: IfNotPresent

# Persistence 설정 (EFS 사용)
persistence:
  enabled: true
  storageClassName: "efs-sc-shared"
  accessModes:
    - ReadWriteMany
  size: 100Gi
  annotations:
    backup: "enabled"
    environment: "production"

# Service 설정
service:
  type: ClusterIP  # Ingress 사용 시 ClusterIP로 설정
  port: 6333
  grpcPort: 6334

# LoadBalancer 설정 (Ingress 사용 시 불필요)
loadBalancer:
  enabled: false  # Ingress를 사용하므로 비활성화
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"

# API Key는 Secret으로 관리 (별도 생성 필요)
# apiKey는 values에 직접 넣지 않고 --set으로 주입하거나 external secret 사용

# Resources
resources:
  requests:
    memory: "1Gi"
    cpu: "1000m"
  limits:
    memory: "2Gi"
    cpu: "2000m"

# Qdrant 설정
config:
  # 클러스터 모드 (확장성)
  cluster:
    enabled: true
    p2p:
      port: 6335
  
  storage:
    performance:
      max_search_threads: 0
    
    optimizers:
      deleted_threshold: 0.2
      vacuum_min_vector_number: 1000
      default_segment_number: 0
      max_segment_size_kb: 200000
      indexing_threshold_kb: 20000
    
    # WAL 설정
    wal:
      wal_capacity_mb: 64
      wal_segments_ahead: 2
  
  log_level: "INFO"
  
  # Telemetry 비활성화
  telemetry_disabled: true

# Security Context
securityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

# Pod Disruption Budget (고가용성)
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# Affinity (가용 영역 분산)
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - qdrant
      topologyKey: topology.kubernetes.io/zone
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - qdrant
        topologyKey: kubernetes.io/hostname

# Ingress 설정
ingress:
  enabled: false